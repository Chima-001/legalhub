<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile - LegalHub</title>
<meta name="description" content="Manage your LegalHub account.">
<meta name="author" content="Cloper Technologies">
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../scripts/auth/supabase-client.js"></script>
<script src="../scripts/auth/auth-guard.js"></script>
<style>body { visibility: hidden; }</style>
</head>
<body class="min-h-screen flex flex-col items-center px-4 py-8"
      style="background: linear-gradient(135deg, #fdf6e3 0%, #f9e2a7 100%);">

  <div class="w-full max-w-md">
    <button id="back-btn" type="button" class="mb-4 text-sm text-[#c98a1f] hover:underline">
      &larr; Back
    </button>

    <div class="flex flex-col items-center mb-6 bg-[#faf7ee] rounded-2xl p-5 border border-gray-200">
      <div id="avatar-large" class="w-14 h-14 flex items-center justify-center rounded-2xl bg-[#f2c14e]/20 mb-2 text-white text-xl font-bold"></div>
      <span class="font-semibold text-[#c98a1f] text-lg">My Profile</span>
    </div>

    <div class="bg-[#faf7ee] rounded-2xl p-6 border border-gray-200 mb-4">
      <div class="mb-3">
        <label class="text-xs text-gray-500 uppercase tracking-wide">Full Name</label>
        <p id="display-name" class="text-gray-800 font-medium">Loading...</p>
      </div>
      <div class="mb-3">
        <label class="text-xs text-gray-500 uppercase tracking-wide">Reg Number</label>
        <p id="display-reg" class="text-gray-800 font-medium">Loading...</p>
      </div>
      <div>
        <label class="text-xs text-gray-500 uppercase tracking-wide">Level</label>
        <p id="display-level" class="text-gray-800 font-medium">Loading...</p>
      </div>
    </div>

      <!-- Username -->
      <div class="bg-[#faf7ee] rounded-2xl p-6 border border-gray-200 mb-4">
        <label class="text-sm text-gray-600 mb-1 block">Username</label>
        <div class="flex gap-2">
          <input id="username-input" type="text" placeholder="Not set"
                 class="flex-1 bg-white rounded-xl px-4 py-2 border border-gray-200 outline-none" />
          <button id="save-username-btn"
            class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-900"
            style="background: linear-gradient(90deg, #ffd166, #f4a123);">Save</button>
        </div>
        <p id="username-status" class="text-sm mt-2"></p>
      </div>

      <!-- Email -->
      <div class="bg-[#faf7ee] rounded-2xl p-6 border border-gray-200 mb-4">
        <label class="text-sm text-gray-600 mb-1 block">Email</label>
        <div class="flex gap-2">
           <input id="new-email-input" type="email" placeholder="you@example.com"
             class="flex-1 bg-white rounded-xl px-4 py-2 border border-gray-200 outline-none" />
          <button id="save-email-btn"
            class="px-4 py-2 rounded-xl text-sm font-semibold text-gray-900"
            style="background: linear-gradient(90deg, #ffd166, #f4a123);">Update</button>
        </div>
        <p class="text-xs text-gray-500 mt-1">Changing this requires re-confirming via email.</p>
        <p id="email-status" class="text-sm mt-2"></p>
      </div>

      <!-- Password -->
      <div class="bg-[#faf7ee] rounded-2xl p-6 border border-gray-200 mb-4">
        <label class="text-sm text-gray-600 mb-1 block">Change Password</label>
        <input id="current-password-input" type="password" placeholder="Current password"
          class="w-full bg-white rounded-xl px-4 py-2 border border-gray-200 outline-none mb-2" />
        <input id="new-password-input" type="password" minlength="6" placeholder="At least 6 characters"
          class="w-full bg-white rounded-xl px-4 py-2 border border-gray-200 outline-none" />
        <button id="save-password-btn"
          class="w-full mt-3 py-2 rounded-xl font-semibold text-gray-900 text-sm"
          style="background: linear-gradient(90deg, #ffd166, #f4a123);">Update Password</button>
        <p id="password-status" class="text-sm mt-2"></p>
      </div>

    <button id="logout-btn"
      class="w-full py-3 rounded-full font-semibold text-gray-700 border border-gray-300 bg-white">
      Log Out
    </button>
  </div>

  <script src="../scripts/avatar.js"></script>
  <script>
    let currentUser = null;

    function statusEl(id, msg, isError = false) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = "text-xs mt-1 " + (isError ? "text-red-500" : "text-green-600");
    }

    async function loadProfile() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return; // auth-guard already handles redirect

      const { data, error } = await supabaseClient
        .from("users")
        .select("full_name, username, reg_number, email")
        .eq("id", session.user.id)
        .single();

      if (error || !data) return;

      currentUser = data;

      document.getElementById("display-name").textContent = data.full_name || "Unnamed";
      document.getElementById("display-reg").textContent = data.reg_number;
      document.getElementById("display-level").textContent = getCurrentLevel();
      document.getElementById("username-input").value = data.username || "";
      renderAvatar(document.getElementById("avatar-large"), data.username || data.full_name, "text-2xl w-20 h-20");
    }

    document.getElementById("save-username-btn").addEventListener("click", async () => {
      const newUsername = document.getElementById("username-input").value.trim();
      const { error } = await supabaseClient
        .from("users")
        .update({ username: newUsername })
        .eq("id", (await supabaseClient.auth.getSession()).data.session.user.id);

      statusEl("username-status", error ? "Couldn't save." : "Saved!", !!error);
    });

    document.getElementById("save-email-btn").addEventListener("click", async () => {
      const newEmail = document.getElementById("new-email-input").value.trim();
      if (!newEmail) return;

      const { error } = await supabaseClient.auth.updateUser({ email: newEmail });

      statusEl(
        "email-status",
        error ? error.message : "Confirmation link sent to your new email - click it to finish the change.",
        !!error
      );
    });

    document.getElementById("save-password-btn").addEventListener("click", async () => {
      const currentPassword = document.getElementById("current-password-input").value;
      const newPassword = document.getElementById("new-password-input").value;

      if (!currentPassword || newPassword.length < 6) {
        statusEl("password-status", "Fill in both fields (new password min 6 characters).", true);
        return;
      }

      // Re-verify identity with current password before allowing a change -
      // Supabase's updateUser doesn't require this by default, but it
      // stops someone from changing the password on an unattended
      // logged-in session without knowing the actual current password.
      const { error: reauthError } = await supabaseClient.auth.signInWithPassword({
        email: currentUser.email,
        password: currentPassword,
      });

      if (reauthError) {
        statusEl("password-status", "Current password is incorrect.", true);
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      statusEl("password-status", error ? error.message : "Password updated!", !!error);

      if (!error) {
        document.getElementById("current-password-input").value = "";
        document.getElementById("new-password-input").value = "";
      }
    });

    const LEVEL_SCHEDULE = [
      { from: new Date("2025-01-01"), level: "100L" },
      { from: new Date("2026-12-01"), level: "200L" }
    ];

    function getCurrentLevel() {
      const now = new Date();
      let current = LEVEL_SCHEDULE[0].level;
      for (const entry of LEVEL_SCHEDULE) {
        if (now >= entry.from) current = entry.level;
      }
      return current;
    }

    document.getElementById("logout-btn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      localStorage.removeItem("legalhub_login_time");
      window.location.href = "login.html";
    });

    document.getElementById("back-btn").addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "../index.html";
      }
    });

    loadProfile();
  </script>

  <footer class="mt-8 mb-2 flex flex-col items-center gap-2 text-xs text-gray-400">
    <span>&copy; <span id="footer-year"></span> LegalHub</span>
    <span class="flex items-center gap-1.5">
      Powered by
      <a href="https://clopertechnologies.netlify.app" target="_blank" rel="noopener noreferrer" class="inline-flex">
        <img src="../assets/images/cloper-logo.svg" alt="Cloper Technologies" class="h-5" />
      </a>
    </span>
  </footer>
  <script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>

</body>
</html>
