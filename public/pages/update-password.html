<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Change your password.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <meta name="author" content="Chima Nnaji — Cloper Technologies">
  <meta property="og:title" content="LegalHub - Update Password" />
  <meta property="og:description"
    content="A law student's platform for course materials, case researches, and lots more." />
  <meta property="og:image" content="https://legalhub-io.netlify.app/assets/images/social-preview.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://legalhub-io.netlify.app/pages/update-password.html" />
  <title>Set New Password - LegalHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../styles/dark-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../styles/password-visibility.css">
  <script defer src="../scripts/password-visibility.js"></script>
</head>

<body class="min-h-screen flex flex-col items-center justify-center px-4"
  >

  <div class="w-full max-w-sm bg-[#faf7ee] rounded-3xl shadow-lg p-8">

    <div class="flex flex-col items-center mb-6">
      <div class="w-14 h-14 flex items-center justify-center rounded-2xl bg-[#f2c14e]/20 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-[#c98a1f]" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>
      <span class="font-semibold text-[#c98a1f] text-lg">LegalHub</span>
    </div>

    <h1 class="text-xl font-bold text-center text-gray-800">Set New Password</h1>
    <p class="text-sm text-gray-500 text-center mt-1 mb-6">Choose a new password for your account</p>

    <!-- Shown while Supabase verifies the reset link/token from the URL -->
    <div id="verifying" role="status" class="text-sm text-gray-500 text-center py-4">Verifying reset link...</div>

    <!-- Shown if the link is invalid/expired -->
    <div id="invalid-link" class="hidden text-sm text-red-500 text-center py-4">
      This reset link is invalid or has expired.<br><a href="forgot-password.html"
        class="text-[#c98a1f] font-medium hover:underline">Request a new one</a>.
    </div>

    <!-- The actual form, shown only once the link is verified -->
    <form id="update-form" class="space-y-4 hidden">

      <div>
        <label class="text-sm text-gray-600 mb-1 block">New Password</label>
        <div class="field-shell flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <input id="password" type="password" required minlength="6" placeholder="At least 6 characters"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>

      <div>
        <label class="text-sm text-gray-600 mb-1 block">Confirm New Password</label>
        <div class="field-shell flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <input id="confirm_password" type="password" required minlength="6" placeholder="Re-enter password"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>

      <p id="error-msg" class="text-sm text-red-500 hidden"></p>

      <button type="submit" id="submit-btn"
        class="w-full py-3 rounded-full font-semibold text-gray-900 shadow-md transition"
        >
        Update Password
      </button>
    </form>
  </div>

  <script src="../scripts/auth/supabase-client.js" data-recovery-only></script>
  <script>
    const verifying = document.getElementById("verifying");
    const invalidLink = document.getElementById("invalid-link");
    const form = document.getElementById("update-form");
    const errorMsg = document.getElementById("error-msg");
    const submitBtn = document.getElementById("submit-btn");

    let recoveryUserId = null;
    let completed = false;

    function invalidateLink() {
      recoveryUserId = null;
      form.reset();
      form.classList.add("hidden");
      verifying.classList.add("hidden");
      invalidLink.classList.remove("hidden");
    }

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.remove("hidden");
    }

    // This client uses only this page's memory. Never use a normal stored session
    // (or a user-controlled URL flag) as evidence of a password-recovery flow.
    const verificationTimer = setTimeout(() => {
      if (!recoveryUserId && !completed) invalidateLink();
    }, 12000);
    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (completed) return;
        if (event === "PASSWORD_RECOVERY" && session?.user?.id) {
          clearTimeout(verificationTimer);
          recoveryUserId = session.user.id;
          verifying.classList.add("hidden");
          invalidLink.classList.add("hidden");
          form.classList.remove("hidden");
        } else if (event === "SIGNED_OUT" || (recoveryUserId && session?.user?.id !== recoveryUserId)) {
          invalidateLink();
        }
      });
    } else {
      clearTimeout(verificationTimer);
      invalidateLink();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!recoveryUserId || completed || submitBtn.disabled) return;
      errorMsg.classList.add("hidden");
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      if (password !== confirmPassword) {
        showError("Passwords don't match.");
        return;
      }
      if (password.length < 6) {
        showError("Use at least 6 characters for your password.");
        return;
      }

      const expectedUser = recoveryUserId;
      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";
      try {
        const { data, error: verificationError } = await supabaseClient.auth.getUser();
        if (verificationError && (!verificationError.status || verificationError.status >= 500)) {
          showError("Couldn't verify the link right now. Please try again.");
          return;
        }
        if (verificationError || data?.user?.id !== expectedUser || recoveryUserId !== expectedUser) {
          invalidateLink();
          return;
        }
        const { error } = await supabaseClient.auth.updateUser({ password });
        if (error) {
          if (error.status === 401 || error.code === "session_not_found") invalidateLink();
          else if (error.code === "same_password") showError("Choose a different password from your current one.");
          else if (error.code === "weak_password") showError("Choose a stronger password and try again.");
          else showError("Couldn't update your password. Please try again or request a new link.");
          return;
        }
        completed = true;
        recoveryUserId = null;
        form.reset();
        form.classList.add("hidden");
        invalidLink.classList.add("hidden");
        verifying.textContent = "Password updated. Taking you to log in...";
        verifying.classList.remove("hidden");
        // End only this temporary recovery session. Do not sign out every device.
        void supabaseClient.auth.signOut({ scope: "local" }).catch(() => {});
        setTimeout(() => window.location.replace("login.html"), 1800);
      } catch {
        showError("Unable to reach the sign-in service. Please try again.");
      } finally {
        if (!completed) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Update Password";
        }
      }
    });
  </script>


  <footer class="mt-8 mb-2 flex flex-col items-center gap-2 text-xs text-gray-400">
    <span>&copy; <span id="footer-year"></span> LegalHub</span>
    <span class="flex items-center gap-1.5">
      Powered by
      <a href="https://clopertechnologies.me" target="_blank" rel="noopener noreferrer" class="inline-flex">
        <img src="../assets/images/cloper-logo-light.svg" alt="Cloper Technologies" class="h-5" />
      </a>
    </span>
  </footer>
  <script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>

</body>

</html>
