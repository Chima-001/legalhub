<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Change your password.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <meta name="author" content="Chima Nnaji — Cloper Technologies">
  <meta property="og:title" content="LegalHub - Update Password" />
  <meta property="og:description"
    content="A law student's platform for course materials, case researches, and lots more." />
  <meta property="og:image" content="https://your-live-domain.com/social-preview.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://your-live-domain.com/" />
  <title>Set New Password - LegalHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen flex flex-col items-center justify-center px-4"
  style="background: linear-gradient(135deg, #fdf6e3 0%, #f9e2a7 100%);">

  <div class="w-full max-w-sm bg-[#faf7ee] rounded-3xl shadow-lg p-8">

    <div class="flex flex-col items-center mb-6">
      <div class="w-14 h-14 flex items-center justify-center rounded-2xl bg-[#f2c14e]/20 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-[#c98a1f]" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>
      <span class="font-semibold text-[#c98a1f] text-lg">LegalHub</span>
    </div>

    <h1 class="text-xl font-bold text-center text-gray-800">Set New Password</h1>
    <p class="text-sm text-gray-500 text-center mt-1 mb-6">Choose a new password for your account</p>

    <!-- Shown while Supabase verifies the reset link/token from the URL -->
    <div id="verifying" class="text-sm text-gray-500 text-center py-4">Verifying reset link...</div>

    <!-- Shown if the link is invalid/expired -->
    <div id="invalid-link" class="hidden text-sm text-red-500 text-center py-4">
      This reset link is invalid or has expired.<br><a href="forgot-password.html"
        class="text-[#c98a1f] font-medium hover:underline">Request a new one</a>.
    </div>

    <!-- The actual form, shown only once the link is verified -->
    <form id="update-form" class="space-y-4 hidden">

      <div>
        <label class="text-sm text-gray-600 mb-1 block">New Password</label>
        <div class="flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <input id="password" type="password" required minlength="6" placeholder="At least 6 characters"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>

      <div>
        <label class="text-sm text-gray-600 mb-1 block">Confirm New Password</label>
        <div class="flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <input id="confirm_password" type="password" required minlength="6" placeholder="Re-enter password"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>

      <p id="error-msg" class="text-sm text-red-500 hidden"></p>
      <p id="success-msg" class="text-sm text-green-600 hidden"></p>

      <button type="submit" id="submit-btn"
        class="w-full py-3 rounded-full font-semibold text-gray-900 shadow-md transition"
        style="background: linear-gradient(90deg, #ffd166, #f4a123); box-shadow: 0 8px 20px rgba(244, 161, 35, 0.4);">
        Update Password
      </button>
    </form>
  </div>

  <script src="../scripts/auth/supabase-client.js"></script>
  <script>
    const verifying = document.getElementById("verifying");
    const invalidLink = document.getElementById("invalid-link");
    const form = document.getElementById("update-form");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");
    const submitBtn = document.getElementById("submit-btn");

    // When the person clicks the reset link in their email, Supabase
    // redirects here with a token that it automatically turns into a
    // temporary session (via detectSessionInUrl, on by default). We just
    // need to check that a session actually exists before showing the form.
    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY" || session) {
        verifying.classList.add("hidden");
        form.classList.remove("hidden");
      }
    });

    // Fallback: if no event fires within a few seconds, the link was
    // likely invalid or expired.
    setTimeout(async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        verifying.classList.add("hidden");
        invalidLink.classList.remove("hidden");
      }
    }, 4000);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");
      successMsg.classList.add("hidden");

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;

      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords don't match.";
        errorMsg.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";

      const { error } = await supabaseClient.auth.updateUser({ password });

      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove("hidden");
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
        return;
      }

      successMsg.textContent = "Password updated! Redirecting to login...";
      successMsg.classList.remove("hidden");
      form.classList.add("hidden");

      setTimeout(() => {
        window.location.href = "login.html";
      }, 2000);
    });
  </script>


  <footer class="mt-8 mb-2 flex flex-col items-center gap-2 text-xs text-gray-400">
    <span>&copy; <span id="footer-year"></span> LegalHub</span>
    <span class="flex items-center gap-1.5">
      Powered by
      <a href="https://clopertechnologies.me" target="_blank" rel="noopener noreferrer" class="inline-flex">
        <img src="../assets/images/cloper-logo.svg" alt="Cloper Technologies" class="h-5" />
      </a>
    </span>
  </footer>
  <script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>

</body>

</html>
