<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to LegalHub - your law course companion.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <meta name="author" content="Chima Nnaji — Cloper Technologies">
  <meta property="og:title" content="LegalHub - login" />
  <meta property="og:description"
    content="A law student's platform for course materials, case researches, and lots more." />
  <meta property="og:image" content="https://your-live-domain.com/social-preview.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://your-live-domain.com/" />
  <title>Log In - LegalHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen flex flex-col items-center justify-center px-4"
  style="background: linear-gradient(135deg, #fdf6e3 0%, #f9e2a7 100%);">

  <div class="w-full max-w-sm bg-[#faf7ee] rounded-3xl shadow-lg p-8">

    <!-- Brand -->
    <div class="flex flex-col items-center mb-6">
      <div class="w-14 h-14 flex items-center justify-center rounded-2xl bg-[#f2c14e]/20 mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-[#c98a1f]" fill="none" viewBox="0 0 24 24"
          stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
        </svg>
      </div>
      <span class="font-semibold text-[#c98a1f] text-lg">LegalHub</span>
    </div>

    <h1 class="text-xl font-bold text-center text-gray-800">Welcome Back</h1>
    <p class="text-sm text-gray-500 text-center mt-1 mb-6">Enter your reg number & password to continue</p>

    <form id="login-form" class="space-y-4">

      <div>
        <label class="text-sm text-gray-600 mb-1 block">Reg Number</label>
        <div class="flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
          </svg>
          <input id="reg_number" type="text" required placeholder="e.g. 2025/231184"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>

      <div>
        <label class="text-sm text-gray-600 mb-1 block">Password</label>
        <div class="flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
          <input id="password" type="password" required placeholder="Enter password"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>

      <div class="text-right">
        <a href="forgot-password.html" class="text-sm text-[#c98a1f] hover:underline">Forgot Password?</a>
      </div>

      <p id="error-msg" class="text-sm text-red-500 hidden"></p>

      <button type="submit" id="submit-btn"
        class="w-full py-3 rounded-full font-semibold text-gray-900 shadow-md transition"
        style="background: linear-gradient(90deg, #ffd166, #f4a123); box-shadow: 0 8px 20px rgba(244, 161, 35, 0.4);">
        Log In
      </button>
    </form>

    <p class="text-sm text-gray-500 text-center mt-6">
      Don't have an account? <a href="signup.html" class="text-[#c98a1f] font-medium hover:underline">Sign up</a>
    </p>
  </div>

  <script src="../scripts/auth/supabase-client.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errorMsg = document.getElementById("error-msg");
    const submitBtn = document.getElementById("submit-btn");

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove("hidden");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";

      const regNumber = document.getElementById("reg_number").value.trim();
      const password = document.getElementById("password").value;

      // Step 1: look up the email tied to this reg number (login only asks
      // for reg number, but Supabase Auth signs in with email underneath)
      const { data: email, error: lookupError } = await supabaseClient
        .rpc("get_email_by_reg_number", { p_reg_number: regNumber });

      if (lookupError || !email) {
        showError("Reg number not found. Please check and try again.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
        return;
      }

      // Step 2: sign in with that email + the password entered
      const { error: signInError } = await supabaseClient.auth.signInWithPassword({
        email,
        password,
      });

      if (signInError) {
        showError(
          signInError.message.includes("Email not confirmed")
            ? "Please confirm your email before logging in - check your inbox."
            : "Incorrect password. Please try again."
        );
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
        return;
      }

      // Success - stamp the login time so auth-guard.js can enforce a 7-day expiry
      localStorage.setItem("legalhub_login_time", Date.now().toString());
      window.location.href = "../index.html";
    });
  </script>


  <footer class="mt-8 mb-2 flex flex-col items-center gap-2 text-xs text-gray-400">
    <span>&copy; <span id="footer-year"></span> LegalHub</span>
    <span class="flex items-center gap-1.5">
      Powered by
      <a href="https://clopertechnologies.me" target="_blank" rel="noopener noreferrer" class="inline-flex">
        <img src="../assets/images/cloper-logo.svg" alt="Cloper Technologies" class="h-5" />
      </a>
    </span>
  </footer>
  <script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>

</body>

</html>
