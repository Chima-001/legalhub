<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign up for LegalHub - your law course companion.">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <meta name="author" content="Chima Nnaji — Cloper Technologies">
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LegalHub" />
  <meta property="og:title" content="Sign Up - LegalHub" />
  <meta property="og:description" content="Create your LegalHub account and join the law school community." />
  <meta property="og:url" content="https://legalhub-io.netlify.app/pages/signup.html" />
  <meta property="og:image" content="https://legalhub-io.netlify.app/assets/images/social-preview.png" />
  <meta property="og:image:alt" content="LegalHub social preview" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Sign Up - LegalHub" />
  <meta name="twitter:description" content="Create your LegalHub account and join the law school community." />
  <meta name="twitter:image" content="https://legalhub-io.netlify.app/assets/images/social-preview.png" />
  <title>Sign Up - LegalHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../styles/dark-theme.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../styles/password-visibility.css">
  <script defer src="../scripts/password-visibility.js"></script>
  <link rel="stylesheet" href="../styles/auth-layout.css">
</head>

<body class="lh-auth-page min-h-screen flex flex-col items-center justify-center px-4 py-10"
  >
  <header class="lh-auth-mast">
    <div class="lh-auth-wordmark" aria-label="LegalHub">
      <span class="lh-auth-monogram" aria-hidden="true">LH</span>
      <span class="lh-auth-word">Legal<b>Hub</b></span>
    </div>
    <span class="lh-auth-section">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 5.7c3.2-.8 6.2-.2 9 1.7 2.8-1.9 5.8-2.5 9-1.7v13c-3.2-.8-6.2-.2-9 1.7-2.8-1.9-5.8-2.5-9-1.7zM12 7.4v13"/></svg>
      Account portal
    </span>
  </header>

  <main class="lh-auth-layout">
    <section class="lh-auth-panel" aria-labelledby="lh-auth-title">
      <p class="lh-auth-kicker">Registration</p>
      <h1 id="lh-auth-title" class="lh-auth-heading">Create an account.</h1>
      <p class="lh-auth-intro">Start with your email and a password. No registration number is required.</p>

    <form id="signup-form" class="space-y-4">

      <div>
        <label for="email" class="text-sm text-gray-600 mb-1 block">Email</label>
        <div class="field-shell flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
          </svg>
          <input id="email" type="email" autocomplete="email" autocapitalize="none" required placeholder="you@example.com"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>

      <div>
        <label for="password" class="text-sm text-gray-600 mb-1 block">Password</label>
        <div class="field-shell flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24"
            stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
          </svg>
          <input id="password" type="password" autocomplete="new-password" required minlength="6" placeholder="At least 6 characters"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>
      <div>
        <label for="confirm_password" class="text-sm text-gray-600 mb-1 block">Confirm Password</label>
        <div class="field-shell flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <input id="confirm_password" type="password" autocomplete="new-password" required minlength="6" placeholder="Re-enter password"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>

      <div>
        <label for="reg_number" class="text-sm text-gray-600 mb-1 block">Registration number <span class="text-gray-400">(optional)</span></label>
        <div class="field-shell flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <input id="reg_number" type="text" aria-describedby="reg-hint" placeholder="e.g. 2025/231184"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
        <p id="reg-hint" class="mt-1 text-xs text-gray-500">For your profile only. It is not used to sign in.</p>
      </div>

      <div>
        <label for="username" class="text-sm text-gray-600 mb-1 block">Username <span class="text-gray-400">(optional)</span></label>
        <div class="field-shell flex items-center bg-white rounded-xl px-4 py-3 border border-gray-200">
          <input id="username" type="text" placeholder="How you'll appear on the site"
            class="w-full bg-transparent outline-none text-gray-800 placeholder-gray-400" />
        </div>
      </div>

      <p role="alert" id="error-msg" class="text-sm text-red-500 hidden"></p>
      <p role="status" id="success-msg" class="text-sm text-green-600 hidden"></p>

      <button type="submit" id="submit-btn"
        class="w-full py-3 rounded-full font-semibold text-gray-900 shadow-md transition"
        >
        Sign Up
      </button>
    </form>

    <p class="text-sm text-gray-500 text-center mt-6">
      Already have an account? <a id="login-link" href="login.html" class="text-[#c98a1f] font-medium hover:underline">Log in</a>
    </p>
    </section>

    <figure class="lh-auth-plate" aria-labelledby="lh-plate-title">
      <picture>
        <source media="(max-width: 53.99rem)" srcset="../assets/images/auth-balance-compact.webp" width="700" height="490">
        <img src="../assets/images/auth-balance.webp" alt="" width="1120" height="1400" decoding="async">
      </picture>
      <figcaption>
        <div class="lh-plate-top"><span>LegalHub study series</span><span>Fig. 01</span></div>
        <div>
          <p id="lh-plate-title" class="lh-plate-title">A study in<br><em>balance.</em></p>
          <p class="lh-plate-legend"><span>The scales of justice</span><span class="lh-plate-index">Symbols of law</span></p>
        </div>
      </figcaption>
    </figure>
  </main>

  <script src="../scripts/auth/supabase-client.js"></script>
  <script src="../scripts/auth/account-routes.js"></script>
  <script>
    const form = document.getElementById("signup-form");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");
    const submitBtn = document.getElementById("submit-btn");
    const routes = window.legalHubAccountRoutes;
    const requested = new URLSearchParams(window.location.search).get("redirect")
      || localStorage.getItem("legalhub_auth_redirect");
    // A missing routing asset must never stop sign-in or forward an unchecked destination.
    const redirectTarget = routes?.returnPath(requested) || new URL("../index.html", window.location.href).pathname;

    localStorage.setItem("legalhub_auth_redirect", redirectTarget);
    document.getElementById("login-link").href =
      `${routes?.loginPath || "login.html"}?redirect=${encodeURIComponent(redirectTarget)}`;

    function showError(msg) {
      successMsg.classList.add("hidden");
      errorMsg.textContent = msg;
      errorMsg.classList.remove("hidden");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (submitBtn.disabled) return;
      errorMsg.classList.add("hidden");
      successMsg.classList.add("hidden");
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (password !== document.getElementById("confirm_password").value) {
        showError("Passwords don't match. Please re-enter.");
        return;
      }
      const username = document.getElementById("username").value.trim();
      const reportedNumber = document.getElementById("reg_number").value.trim();
      const metadata = {};
      if (username) metadata.username = username;
      // Self-reported profile detail only. No lookup, official identity or role assignment.
      if (reportedNumber) metadata.reported_reg_number = reportedNumber;

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";
      try {
        const emailRedirectTo = routes?.confirmationHref || new URL("confirmed.html", window.location.href).href;
        const { error } = await supabaseClient.auth.signUp({
          email, password, options: { data: metadata, emailRedirectTo }
        });
        if (error && !["user_already_exists", "email_exists"].includes(error.code)) {
          if (error.status === 429) showError("Too many requests. Please wait before trying again.");
          else if (error.code === "weak_password") showError("Choose a stronger password and try again.");
          else if (error.code === "email_address_invalid") showError("Enter a valid email address.");
          else showError("Unable to create an account right now. Please try again.");
          return;
        }
        successMsg.textContent = "Check your inbox for a confirmation link. If you already have an account, log in with your email.";
        successMsg.classList.remove("hidden");
        form.reset();
      } catch {
        showError("Unable to reach the sign-in service. Please try again.");
      } finally {
        submitBtn.textContent = "Sign Up";
        submitBtn.disabled = false;
      }
    });
  </script>


  <footer class="mt-8 mb-2 flex flex-col items-center gap-2 text-xs text-gray-400">
    <span>&copy; <span id="footer-year"></span> LegalHub</span>
    <span class="flex items-center gap-1.5">
      Powered by
      <a href="https://clopertechnologies.me" target="_blank" rel="noopener noreferrer" class="inline-flex">
        <img src="../assets/images/cloper-logo-light.svg" alt="Cloper Technologies" class="h-5" />
      </a>
    </span>
  </footer>
  <script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>

</body>

</html>
