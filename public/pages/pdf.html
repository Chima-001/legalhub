<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta property="og:title" content="LegalHub Course Library" />
  <meta property="og:description"
    content="A law student's platform for course materials, case researches, and lots more." />
  <meta property="og:image" content="https://your-live-domain.com/social-preview.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://your-live-domain.com/" />
  <title>LegalHub Course Library</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
  <link rel="stylesheet" href="../styles/output.css">
  <link rel="stylesheet" href="../styles/pdf-library.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
  </script>

  <style>
    body {
      visibility: hidden;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../scripts/auth/supabase-client.js"></script>
  <script src="../scripts/auth/auth-guard.js"></script>
</head>

<body>


  <header class="top-nav">
    <div class="logo">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <path
          d="M6 6.5a2 2 0 0 1 2-2h6.5c2 0 3.5.7 4.5 1.8 1-1.1 2.5-1.8 4.5-1.8H24a2 2 0 0 1 2 2v18a1.5 1.5 0 0 1-1.9 1.45l-1.1-.3c-1.7-.45-3.4-.08-4.8 1.05a.35.35 0 0 1-.4 0c-1.4-1.13-3.1-1.5-4.8-1.05l-1.1.3A1.5 1.5 0 0 1 10 24.5V6.5Z"
          fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
        <path d="M16 7v17.5M9 9h4M9 13h4M19 9h4M19 13h4" fill="none" stroke="currentColor" stroke-width="1.5"
          stroke-linecap="round" />
      </svg>
      <span><strong>LegalHub</strong><small>Course Library</small></span>
    </div>
    <div class="nav-actions">
      <span class="stats-badge" id="statsDisplay">
        <strong id="visibleCount">0</strong> / <strong id="totalBooks">0</strong>
      </span>
      <a class="upload-link" href="materials.html" aria-label="Upload a material">
        <span aria-hidden="true">＋</span> Upload
      </a>
      <button class="hamburger" id="hamburgerBtn" aria-label="Open course menu">
        ☰
      </button>
    </div>
  </header>

  <!-- ─── SEARCH ───────────────────────────────────────────────────── -->
  <div class="search-container">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search for books..." autofocus />
      <span class="shortcut-hint">⌘K</span>
    </div>
  </div>

  <!-- ─── FILTER CHIPS (Desktop) ──────────────────────────────────── -->
  <div class="filter-chips-wrapper">
    <div class="filter-chips" id="filterChips"></div>
  </div>

  <div class="library-filters" aria-label="Library filters">
    <label>Level
      <select id="levelFilter">
        <option value="all">All levels</option>
        <option value="100L">100L</option>
        <option value="200L">200L</option>
        <option value="300L">300L</option>
        <option value="400L">400L</option>
        <option value="500L">500L</option>
        <option value="Relevant">Relevant Materials</option>
      </select>
    </label>
    <label>Semester
      <select id="semesterFilter">
        <option value="all">All semesters</option>
        <option value="first">First semester</option>
        <option value="second">Second semester</option>
      </select>
    </label>
    <button id="resetFilters" type="button">Show all</button>
  </div>

  <!-- ─── BOOK GRID ────────────────────────────────────────────────── -->
  <main class="book-grid" id="bookGrid"></main>

  <!-- ─── FOOTER ───────────────────────────────────────────────────── -->
  <div class="site-footer">
    <footer class="mt-8 mb-2 flex flex-col items-center gap-2 text-xs text-gray-400">
      <span>&copy; <span id="footer-year"></span> LegalHub — Victorious Tech Institute</span>
      <span class="flex items-center gap-1.5">
        Powered by
        <a href="https://clopertechnologies.me" target="_blank" rel="noopener noreferrer" class="inline-flex">
          <img src="../assets/images/cloper-logo.svg" alt="Cloper Technologies" class="h-5" />
        </a>
      </span>
    </footer>
    <script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>
    <!-- © 2026 <span>LegalHub</span> — Course Materials Library -->
  </div>

  <!-- ─── BOTTOM SHEET (Mobile Navigation) ────────────────────────── -->
  <div class="bottom-sheet-overlay" id="bottomSheetOverlay">
    <div class="bottom-sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <span class="sheet-title"><svg class="sheet-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path
              d="M6 6.5a2 2 0 0 1 2-2h6.5c2 0 3.5.7 4.5 1.8 1-1.1 2.5-1.8 4.5-1.8H24a2 2 0 0 1 2 2v18a1.5 1.5 0 0 1-1.9 1.45l-1.1-.3c-1.7-.45-3.4-.08-4.8 1.05a.35.35 0 0 1-.4 0c-1.4-1.13-3.1-1.5-4.8-1.05l-1.1.3A1.5 1.5 0 0 1 10 24.5V6.5Z"
              fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M16 7v17.5M9 9h4M9 13h4M19 9h4M19 13h4" fill="none" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" />
          </svg> Courses</span>
        <button class="sheet-close" id="sheetCloseBtn">✕</button>
      </div>
      <div class="sheet-course-list" id="mobileCourseList">
        <!-- Injected by JavaScript -->
      </div>
    </div>
  </div>

  <script src="../scripts/pdfs.js"></script>
</body>

</html>
