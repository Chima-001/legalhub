<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>📚 Course Materials · Admin + Upload</title>
  <!-- Font Awesome for icons (optional but nice) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --primary: #0F172A;
      --accent: #3B82F6;
      --accent-light: #EFF6FF;
      --text: #1E293B;
      --text-secondary: #64748B;
      --border: #E2E8F0;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
      --radius: 16px;
      --radius-sm: 10px;
      --danger: #EF4444;
      --success: #22C55E;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 2rem;
    }
    /* layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226,232,240,0.6);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--primary); }
    .nav-actions { display: flex; gap: 12px; align-items: center; }
    .badge {
      background: var(--bg);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn {
      padding: 6px 14px;
      border-radius: 40px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.1s;
    }
    .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn-outline { background: transparent; border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: white; border-color: var(--danger); }
    .btn-success { background: var(--success); color: white; border-color: var(--success); }
    .btn-sm { padding: 4px 10px; font-size: 0.7rem; }
    .upload-area {
      background: var(--surface);
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 30px 20px;
      text-align: center;
      margin: 16px 0;
      transition: 0.2s;
    }
    .upload-area.drag-over { border-color: var(--accent); background: var(--accent-light); }
    .file-list, .admin-list {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 8px 0;
      margin: 16px 0;
      border: 1px solid var(--border);
    }
    .file-item, .admin-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 8px;
    }
    .file-item:last-child, .admin-item:last-child { border-bottom: none; }
    .file-info { display: flex; flex-direction: column; gap: 2px; flex: 2; min-width: 120px; }
    .file-name { font-weight: 600; font-size: 0.9rem; }
    .file-meta { font-size: 0.7rem; color: var(--text-secondary); }
    .file-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .status-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 40px;
      background: #F1F5F9;
      color: var(--text-secondary);
    }
    .status-pending { background: #FEF3C7; color: #B45309; }
    .status-approved { background: #D1FAE5; color: #065F46; }
    .status-rejected { background: #FEE2E2; color: #991B1B; }
    .grid-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 700px) { .grid-2col { grid-template-columns: 1fr; } }

    /* book cards (public view) */
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin: 16px 0;
    }
    .book-card {
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(226,232,240,0.4);
      cursor: default;
    }
    .book-cover {
      aspect-ratio: 3/4;
      background: #F1F5F9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: var(--text-secondary);
      border-bottom: 3px solid #CBD5E1;
    }
    .book-meta { padding: 10px 12px 12px; }
    .book-title { font-weight: 700; font-size: 0.85rem; }
    .course-tag {
      background: var(--accent-light);
      padding: 2px 10px;
      border-radius: 40px;
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--accent);
      display: inline-block;
      margin-top: 4px;
    }
    .book-actions { display: flex; gap: 6px; margin-top: 6px; }
    .btn-read, .btn-download {
      flex:1;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.6rem;
      background: var(--surface);
      text-align: center;
      cursor: pointer;
    }
    .btn-read { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }

    .admin-panel-toggle { margin-left: auto; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="logo"><i class="fas fa-graduation-cap"></i> <span>030 Library</span></div>
    <div class="nav-actions">
      <span class="badge" id="publicCount">📚 0</span>
      <button class="btn btn-primary btn-sm" id="toggleAdminBtn"><i class="fas fa-user-shield"></i> Admin</button>
    </div>
  </header>

  <div class="container">
    <!-- Admin panel (toggle) -->
    <div id="adminPanel" class="hidden" style="margin-top:16px;">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
        <h3><i class="fas fa-shield-alt"></i> Admin · Pending approvals</h3>
        <span class="badge" id="pendingCount">0 pending</span>
        <button class="btn btn-outline btn-sm" id="logoutAdminBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
      <!-- admin login (simple password) -->
      <div id="adminLogin" style="background:var(--surface); padding:20px; border-radius:var(--radius); border:1px solid var(--border);">
        <p style="margin-bottom:8px;">Enter admin password to manage uploads</p>
        <input type="password" id="adminPasswordInput" placeholder="password" style="padding:8px 12px; border-radius:40px; border:1px solid var(--border); margin-right:8px;" />
        <button class="btn btn-primary" id="adminLoginBtn">Unlock</button>
        <div style="margin-top:6px; font-size:0.7rem; color:var(--text-secondary);">(default: admin123)</div>
      </div>
      <div id="adminContent" class="hidden">
        <div class="admin-list" id="adminList">
          <!-- injected -->
        </div>
        <div style="margin:12px 0;">
          <button class="btn btn-outline btn-sm" id="refreshAdminBtn"><i class="fas fa-sync"></i> Refresh</button>
        </div>
      </div>
    </div>

    <!-- Upload section (for students) -->
    <div class="upload-area" id="uploadArea">
      <i class="fas fa-cloud-upload-alt fa-2x" style="color:var(--accent);"></i>
      <p style="margin:6px 0;"><strong>Upload your PDF materials</strong><br/><span style="font-size:0.8rem; color:var(--text-secondary);">Files will be reviewed by admin before going public.</span></p>
      <input type="file" id="fileInput" accept=".pdf" multiple style="display:none;" />
      <button class="btn btn-primary" id="uploadBtn"><i class="fas fa-upload"></i> Choose PDF(s)</button>
      <div id="uploadStatus" style="margin-top:8px; font-size:0.8rem;"></div>
    </div>

    <!-- Public book grid -->
    <h3 style="margin-top:16px;"><i class="fas fa-book-open"></i> Public Materials</h3>
    <div class="book-grid" id="publicGrid"></div>

    <!-- Footer -->
    <div class="site-footer" style="text-align:center; padding:16px 0; font-size:0.7rem; color:var(--text-secondary); border-top:1px solid var(--border); margin-top:16px;">
      © 2026 Victorious Tech Institute — Legal Intelligence Hub
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // ─── STATE ──────────────────────────────────────────────────
      let allUploads = []; // { id, fileName, course, status, fileDataURL?, uploadedAt }
      let publicBooks = []; // filtered status === 'approved'
      let adminAuthenticated = false;
      const ADMIN_PASSWORD = 'admin123'; // in production, use proper auth

      // DOM refs
      const publicGrid = document.getElementById('publicGrid');
      const adminList = document.getElementById('adminList');
      const adminPanel = document.getElementById('adminPanel');
      const adminLogin = document.getElementById('adminLogin');
      const adminContent = document.getElementById('adminContent');
      const toggleAdminBtn = document.getElementById('toggleAdminBtn');
      const logoutAdminBtn = document.getElementById('logoutAdminBtn');
      const adminLoginBtn = document.getElementById('adminLoginBtn');
      const adminPasswordInput = document.getElementById('adminPasswordInput');
      const refreshAdminBtn = document.getElementById('refreshAdminBtn');
      const fileInput = document.getElementById('fileInput');
      const uploadBtn = document.getElementById('uploadBtn');
      const uploadStatus = document.getElementById('uploadStatus');
      const publicCount = document.getElementById('publicCount');
      const pendingCount = document.getElementById('pendingCount');
      const uploadArea = document.getElementById('uploadArea');

      // ─── HELPERS ──────────────────────────────────────────────────
      function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 6); }

      function formatDate(ts) { return new Date(ts).toLocaleDateString() + ' ' + new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }

      // ─── RENDER PUBLIC BOOKS ────────────────────────────────────
      function renderPublic() {
        publicBooks = allUploads.filter(u => u.status === 'approved');
        publicCount.textContent = '📚 ' + publicBooks.length;
        if (publicBooks.length === 0) {
          publicGrid.innerHTML = `<div class="empty-state"><i class="fas fa-inbox fa-3x"></i><p>No approved materials yet.</p></div>`;
          return;
        }
        let html = '';
        publicBooks.forEach(book => {
          const filePath = book.fileDataURL || '#'; // in real app, use R2 URL
          html += `
            <div class="book-card">
              <div class="book-cover" style="background: #E2E8F0;"><i class="fas fa-file-pdf fa-3x" style="color:#64748B;"></i></div>
              <div class="book-meta">
                <div class="book-title">${escapeHtml(book.fileName.replace(/\.pdf$/i,''))}</div>
                <span class="course-tag">${escapeHtml(book.course || 'General')}</span>
                <div class="book-actions">
                  <button class="btn-read" onclick="window.open('${filePath}', '_blank')"><i class="fas fa-eye"></i> Read</button>
                  <button class="btn-download" onclick="downloadFile('${filePath}')"><i class="fas fa-download"></i> Download</button>
                </div>
              </div>
            </div>
          `;
        });
        publicGrid.innerHTML = html;
      }

      // ─── RENDER ADMIN LIST ──────────────────────────────────────
      function renderAdmin() {
        if (!adminAuthenticated) { adminLogin.classList.remove('hidden'); adminContent.classList.add('hidden'); return; }
        adminLogin.classList.add('hidden'); adminContent.classList.remove('hidden');
        const pending = allUploads.filter(u => u.status === 'pending');
        pendingCount.textContent = pending.length + ' pending';
        if (pending.length === 0) {
          adminList.innerHTML = `<div class="file-item" style="color:var(--text-secondary);">✨ All clear — no pending uploads.</div>`;
          return;
        }
        let html = '';
        pending.forEach(item => {
          html += `
            <div class="admin-item" data-id="${item.id}">
              <div class="file-info">
                <span class="file-name"><i class="fas fa-file-pdf"></i> ${escapeHtml(item.fileName)}</span>
                <span class="file-meta">${escapeHtml(item.course || 'No course')} · uploaded ${formatDate(item.uploadedAt)}</span>
              </div>
              <div class="file-actions">
                <button class="btn btn-success btn-sm approve-btn" data-id="${item.id}"><i class="fas fa-check"></i> Approve</button>
                <button class="btn btn-danger btn-sm reject-btn" data-id="${item.id}"><i class="fas fa-times"></i> Reject</button>
              </div>
            </div>
          `;
        });
        adminList.innerHTML = html;
        // attach events
        document.querySelectorAll('.approve-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            approveUpload(id);
          });
        });
        document.querySelectorAll('.reject-btn').forEach(btn => {
          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            const id = this.dataset.id;
            rejectUpload(id);
          });
        });
      }

      // ─── ACTIONS: approve / reject ──────────────────────────────
      function approveUpload(id) {
        const item = allUploads.find(u => u.id === id);
        if (!item) return;
        item.status = 'approved';
        // In real app: move file to public storage (R2)
        renderAdmin();
        renderPublic();
        // notification simulation
        console.log(`✅ Approved: ${item.fileName}`);
        showStatus('✅ Approved: ' + item.fileName, 'success');
      }

      function rejectUpload(id) {
        const item = allUploads.find(u => u.id === id);
        if (!item) return;
        // remove from allUploads (and from storage)
        allUploads = allUploads.filter(u => u.id !== id);
        renderAdmin();
        renderPublic();
        console.log(`❌ Rejected and removed: ${item.fileName}`);
        showStatus('❌ Rejected: ' + item.fileName, 'danger');
      }

      // ─── UPLOAD HANDLER ──────────────────────────────────────────
      function handleFiles(files) {
        if (!files || files.length === 0) return;
        let count = 0;
        Array.from(files).forEach(file => {
          if (file.type !== 'application/pdf') {
            showStatus('⚠️ Only PDF files allowed.', 'danger');
            return;
          }
          const reader = new FileReader();
          reader.onload = function(e) {
            const dataURL = e.target.result;
            const newUpload = {
              id: generateId(),
              fileName: file.name,
              course: 'General', // could add course selector
              status: 'pending',
              fileDataURL: dataURL, // store as data URL for demo; in production upload to R2
              uploadedAt: Date.now()
            };
            allUploads.push(newUpload);
            // notify admin: we just push to list; in real app send email/notification
            console.log('📬 New upload pending:', file.name);
            showStatus(`📤 "${file.name}" uploaded for review.`, 'info');
            renderAdmin();
            renderPublic();
            // auto open admin panel if not authenticated? just hint
            if (!adminAuthenticated) {
              showStatus('🔐 Admin login required to approve.', 'info');
            }
          };
          reader.readAsDataURL(file);
          count++;
        });
        if (count > 0) {
          // reset file input
          fileInput.value = '';
        }
      }

      // ─── UI HELPERS ──────────────────────────────────────────────
      function showStatus(msg, type = 'info') {
        uploadStatus.innerHTML = msg;
        uploadStatus.style.color = type === 'danger' ? '#991B1B' : type === 'success' ? '#065F46' : '#1E293B';
        setTimeout(() => { uploadStatus.innerHTML = ''; }, 5000);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"]/g, function(m) {
          if (m === '&') return '&amp;'; if (m === '<') return '&lt;'; if (m === '>') return '&gt;'; if (m === '"') return '&quot;';
          return m;
        });
      }

      // global download helper
      window.downloadFile = function(url) {
        if (!url || url === '#') return;
        const a = document.createElement('a');
        a.href = url;
        a.download = url.split('/').pop() || 'document.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      // ─── ADMIN AUTH ──────────────────────────────────────────────
      function authenticate(password) {
        if (password === ADMIN_PASSWORD) {
          adminAuthenticated = true;
          renderAdmin();
          showStatus('🔓 Admin access granted.', 'success');
          return true;
        } else {
          showStatus('❌ Wrong password.', 'danger');
          return false;
        }
      }

      function logoutAdmin() {
        adminAuthenticated = false;
        adminLogin.classList.remove('hidden');
        adminContent.classList.add('hidden');
        adminPasswordInput.value = '';
        showStatus('🔒 Logged out.', 'info');
      }

      // ─── EVENT LISTENERS ──────────────────────────────────────────

      // Toggle admin panel
      toggleAdminBtn.addEventListener('click', function() {
        adminPanel.classList.toggle('hidden');
        if (!adminPanel.classList.contains('hidden')) {
          if (!adminAuthenticated) {
            adminLogin.classList.remove('hidden');
            adminContent.classList.add('hidden');
          } else {
            renderAdmin();
          }
        }
      });

      adminLoginBtn.addEventListener('click', function() {
        authenticate(adminPasswordInput.value);
      });
      adminPasswordInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') authenticate(this.value); });

      logoutAdminBtn.addEventListener('click', logoutAdmin);

      refreshAdminBtn.addEventListener('click', function() {
        if (adminAuthenticated) renderAdmin();
      });

      // Upload
      uploadBtn.addEventListener('click', function() { fileInput.click(); });
      fileInput.addEventListener('change', function(e) {
        if (this.files.length) handleFiles(this.files);
      });

      // Drag and drop
      uploadArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        this.classList.add('drag-over');
      });
      uploadArea.addEventListener('dragleave', function(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
      });
      uploadArea.addEventListener('drop', function(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
        if (e.dataTransfer.files.length) {
          handleFiles(e.dataTransfer.files);
        }
      });

      // ─── SEED SOME DEMO DATA ─────────────────────────────────────
      function seedDemo() {
        // add a couple of pending and one approved for demo
        const demoApproved = {
          id: 'demo-1',
          fileName: 'Legal_Methods_101.pdf',
          course: 'legal method',
          status: 'approved',
          fileDataURL: '#',
          uploadedAt: Date.now() - 3600000
        };
        const demoPending = {
          id: 'demo-2',
          fileName: 'Customary_Land_Tenure.pdf',
          course: 'Customary law',
          status: 'pending',
          fileDataURL: '#',
          uploadedAt: Date.now() - 1800000
        };
        const demoPending2 = {
          id: 'demo-3',
          fileName: 'Philosophy_Notes.pdf',
          course: 'philosophy',
          status: 'pending',
          fileDataURL: '#',
          uploadedAt: Date.now() - 600000
        };
        allUploads.push(demoApproved, demoPending, demoPending2);
        renderPublic();
        renderAdmin();
      }

      // ─── INIT ──────────────────────────────────────────────────────
      // In production, load from server. For demo we seed.
      seedDemo();
      console.log('📚 Library ready. Admin password: admin123');

      // expose for debugging
      window.__state = { allUploads, publicBooks };

    })();
  </script>
</body>
</html>
